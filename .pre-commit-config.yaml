repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        types_or: [c, c++]
        args: ["-i"]

      - id: cmake-format-check
        name: cmake-configure-check
        entry: bash -c "cmake -S . -B /tmp/cmake-precommit-check >/dev/null"
        language: system
        pass_filenames: false